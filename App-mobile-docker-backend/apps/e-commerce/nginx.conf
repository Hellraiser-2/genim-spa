# Servidor web del contenedor de la tienda. `${API_URL}` se reemplaza al arrancar con la
# dirección del backend; las variables propias de nginx (`$uri`, `$host`) se conservan.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;

  # El asesor de inversión busca en internet antes de responder y puede tardar varios
  # minutos: su ruta espera más que el resto de la API.
  location ^~ /api/v1/asesor/ {
    proxy_pass ${API_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
  }

  # La API se publica en el mismo origen que la tienda. `^~` le da prioridad sobre las
  # reglas de archivos, aunque una ruta de la API termine en `.js` o `.jpg`.
  location ^~ /api/ {
    proxy_pass ${API_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Los archivos compilados llevan un hash en el nombre: pueden guardarse indefinidamente.
  location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:ico|png|jpg|jpeg|svg|webp|gif)$ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # La tienda resuelve sus propias rutas: cualquier otra dirección entrega el índice,
  # que no se guarda en caché para que una versión nueva se vea de inmediato.
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
