# Servidor web del contenedor de la app. `${API_URL}` se reemplaza al arrancar con la
# dirección del backend; las variables propias de nginx (`$uri`, `$host`) se conservan.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # La foto de un producto nuevo viaja en el cuerpo de la solicitud.
  client_max_body_size 10m;

  add_header X-Content-Type-Options nosniff always;

  # La API se publica en el mismo origen que la app. `^~` le da prioridad sobre la
  # regla de archivos compilados, aunque una ruta de la API termine en `.js`.
  location ^~ /api/ {
    proxy_pass ${API_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Los archivos compilados llevan un hash en el nombre: pueden guardarse indefinidamente.
  location ~* \.(?:js|css|woff2)$ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # La app resuelve sus propias rutas: cualquier otra dirección entrega el índice,
  # que no se guarda en caché para que una versión nueva se vea de inmediato.
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
