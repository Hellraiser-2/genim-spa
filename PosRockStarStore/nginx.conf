# Servidor web del contenedor del POS. `${API_URL}` se reemplaza al arrancar con la
# direccion del backend Rockstar; las variables propias de nginx (`$uri`, `$host`)
# se conservan. Igual patron que apps/e-commerce/nginx.conf del backend.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;

  # La API se publica en el mismo origen que el POS: el navegador llama a /api/v1/...
  # y nginx lo reenvia al contenedor api. Asi no hay CORS que configurar.
  location ^~ /api/ {
    proxy_pass ${API_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Los archivos compilados llevan hash: cache larga.
  location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:ico|png|jpg|jpeg|svg|webp|gif)$ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta entrega el indice sin cache.
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
